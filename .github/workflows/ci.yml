# CI for NEXUS.
#
# Deliberately secret-free: NEXUS is an account-less BYOK tool, so nothing here
# needs an API key, a database, or Infisical. (The upstream workflow this
# replaces pulled a large secrets context for its paid backend; that backend is
# not part of this fork.)
#
# Tests run on Linux and Windows because the CLI ships binaries for both and
# past breakage in this repo was specifically cross-platform filesystem
# behaviour, which a Linux-only run would not have caught.

name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Installs the Bun version pinned in .bun-version, restores the dependency
      # cache, and runs `bun install --frozen-lockfile`.
      - uses: ./.github/actions/setup-project

      - name: Typecheck all workspaces
        run: bun --filter='*' run typecheck

      # Deliberately not blocking, and deliberately not folded into the step
      # above (the root "typecheck" script runs both). check-env-architecture
      # requires every process.env read to sit inside a package's env helper,
      # but the account-less BYOK boot path — cli/src/pre-init/byok-key.ts,
      # chat.tsx, command-registry.ts — reads process.env directly by design.
      # Reported so the debt stays visible without wedging every PR.
      - name: Env architecture check (informational)
        continue-on-error: true
        run: bun scripts/check-env-architecture.ts

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing should not hide the result on the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Run tests
        run: bun run test

# No format job on purpose: `prettier --check` currently flags ~510 files,
# almost all inherited from upstream. A job that is red from day one gets
# ignored, and reformatting those files wholesale would add a 510-file diff to
# a fork that already diverges heavily. Run `bun run format` on the files you
# touch instead.
