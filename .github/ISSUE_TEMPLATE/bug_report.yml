name: Reportar un bug
description: Algo no funciona como debería
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo.

        **Nunca pegues tu API key**, ni siquiera parcial. La salida de
        `nexus doctor` es segura de compartir: enmascara la key a propósito.

        Si encontraste una vulnerabilidad de seguridad, no abras un issue —
        seguí [SECURITY.md](https://github.com/jc-morales-dev/nexus-cli/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: Qué pasó
      description: Qué esperabas que pasara y qué pasó en realidad.
      placeholder: |
        Esperaba que NEXUS editara el archivo.
        En cambio mostró "Error inesperado" y no cambió nada.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Cómo reproducirlo
      description: Los pasos mínimos para que le pase a otra persona.
      placeholder: |
        1. Abrir NEXUS en un proyecto de TypeScript
        2. Escribir "agregá un test para foo.ts"
        3. Ver el error
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Salida de `nexus doctor`
      description: >
        Pegá la salida completa. Sirve para descartar de entrada la mitad de
        las causas posibles (falta la key, está revocada, falta git, el
        directorio es de solo lectura). No muestra tu key.
      render: text
      placeholder: |
        $ nexus doctor

        ✓ OK  Versión de NEXUS
              1.0.3
        ...
    validations:
      required: true

  - type: textarea
    id: debug-output
    attributes:
      label: Salida con `--debug`
      description: >
        Si hay un error, volvé a correrlo con `nexus --debug` y pegá el
        resultado. Revisá que no haya nada sensible antes de pegarlo.
      render: text
    validations:
      required: false

  - type: input
    id: model
    attributes:
      label: Modelo
      description: Qué modelo tenías configurado (lo dice `nexus doctor`).
      placeholder: deepseek/deepseek-v3.2
    validations:
      required: false

  - type: dropdown
    id: install-method
    attributes:
      label: Cómo lo instalaste
      options:
        - npm (@jc-morales-dev/nexus-cli)
        - Desde el código fuente (bun dev)
        - Otro
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Algo más
      description: Cualquier cosa que creas que ayuda.
    validations:
      required: false
