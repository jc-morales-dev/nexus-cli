# Security scanning for NEXUS.
#
# Three checks, chosen because each catches something the others cannot:
#
#   - CodeQL         → code-level vulnerabilities (injection, path traversal,
#                      unsafe deserialisation) across the TypeScript tree.
#   - Secret scan    → a credential committed by accident. NEXUS is a BYOK tool
#                      whose whole threat model is "the user's key leaks", so
#                      this is the highest-value check in the file.
#   - Dependency audit → known CVEs in the dependency tree.
#
# Deliberately NOT included: a second SAST tool, a licence scanner, and a
# container scanner. There are no containers, the licence situation is settled
# (Apache-2.0 + NOTICE), and a second SAST would report the same findings as
# CodeQL with different wording.

name: Security

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    # Weekly, so a CVE published after a PR merged still gets found.
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended adds the lower-confidence rules. Worth the noise
          # on a tool that executes shell commands and writes files on the
          # user's behalf.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project

      # Reported, not blocking — on purpose.
      #
      # The remaining advisories are all transitive through dependencies this
      # repo pins deliberately (@opentui/core and @opentui/react, which the TUI
      # is pinned to exactly) or through build-time tooling with no runtime
      # surface. None of them has a fix available at the pinned version, so a
      # blocking job would be red on every single PR from day one — and a job
      # that is always red is a job everyone learns to ignore, including for
      # the advisory that does matter.
      #
      # What blocks instead: the secret scan and CodeQL above, both of which
      # are green today and catch the failure modes that actually apply to a
      # BYOK CLI.
      #
      # Revisit when @opentui ships an update: `bun audit` should be clean of
      # critical findings, and this can become blocking.
      - name: Audit dependencies (informational)
        continue-on-error: true
        run: bun audit

      # This one does block: a *new* critical advisory in a direct dependency
      # is something a maintainer must look at before merging.
      - name: Fail on new critical advisories in direct dependencies
        run: |
          set -euo pipefail
          # Known and accepted, with no fix at the pinned version.
          KNOWN='GHSA-w7jw-789q-3m8p'
          FOUND="$(bun audit 2>&1 | grep -i 'critical:' || true)"
          UNKNOWN="$(echo "$FOUND" | grep -v "$KNOWN" | grep -i 'critical:' || true)"
          if [ -n "$UNKNOWN" ]; then
            echo "::error::Advisory crítico nuevo (no está en la lista de aceptados):"
            echo "$UNKNOWN"
            exit 1
          fi
          echo "Sin advisories críticos nuevos."
