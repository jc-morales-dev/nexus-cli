[install]
# Use hoisted installs to prevent duplicate dependency trees in Bun v1.3
linker = "hoisted"
# Link workspace packages so builds resolve shared dependencies under hoisted mode
linkWorkspacePackages = true

[test]
# Integration tests need real services (DB, network), so they stay out of the
# default run.
exclude = ["**/*.integration.test.*"]
preload = ["./test/setup-scm-loader.ts", "./sdk/test/setup-env.ts", "./test/setup-bigquery-mocks.ts"]
