  '''sk-ant-api03-abcdefghijklmnop1234567890''',
  '''ghp_abcdefghijklmnopqrstuvwxyz0123456789''',
  '''Zm9vYmFyYmF6cXV4MTIzNDU2Nzg5''',
]
paths = [
  '''cli/scratch/''',
]
